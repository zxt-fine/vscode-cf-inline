name: Release installation bundle

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "asset=vscode-cf-inline-$version.vsix" >> $env:GITHUB_OUTPUT
          "bundle=codeforces-inline-$version-complete.zip" >> $env:GITHUB_OUTPUT

      - name: Package extension
        run: npm run package -- --out ${{ steps.version.outputs.asset }}

      - name: Package VSIX and Edge extension together
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP 'codeforces-inline-complete'
          New-Item -ItemType Directory -Path $bundleRoot | Out-Null
          Copy-Item '${{ steps.version.outputs.asset }}' $bundleRoot
          Copy-Item 'edge-extension' (Join-Path $bundleRoot 'edge-extension') -Recurse
          @'
          Codeforces Inline 完整安装包

          1. 在 VS Code 扩展页面右上角选择“从 VSIX 安装”，选择本目录中的 .vsix 文件。
          2. 在 Edge 打开 edge://extensions，开启“开发人员模式”。
          3. 点击“加载解压缩的扩展”，选择本目录中的 edge-extension 文件夹。
          4. 在 VS Code 执行“开发人员: 重新加载窗口”，然后打开 Codeforces Inline。
          '@ | Set-Content (Join-Path $bundleRoot '安装说明.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath '${{ steps.version.outputs.bundle }}' -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Codeforces Inline ${{ steps.version.outputs.tag }}
          body: |
            Codeforces Inline ${{ steps.version.outputs.version }} 已发布。

            本版本增加本地提交历史和刷题仪表盘，完善题目标记、统计同步、提交结果追踪、英文/俄文题面翻译、公式占位符保护、样例复制、折叠内容以及日常 Edge 登录恢复。

            已知限制：配套 Edge 扩展仍可能复用日常 Codeforces 标签页作为后台执行页，与部分篡改猴脚本产生页面级冲突；后续版本将改为完全隔离的专属执行页。

            推荐下载 `complete.zip` 完整安装包，其中同时包含 VSIX、Edge 配套扩展和安装说明；也可以只下载 VSIX。完整更新记录请查看 CHANGELOG.md。
          files: |
            ${{ steps.version.outputs.asset }}
            ${{ steps.version.outputs.bundle }}
          fail_on_unmatched_files: true
          overwrite_files: true
