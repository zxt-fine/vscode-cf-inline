name: Release VSIX

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "asset=vscode-cf-inline-$version.vsix" >> $env:GITHUB_OUTPUT

      - name: Package extension
        run: npm run package -- --out ${{ steps.version.outputs.asset }}

      - name: Verify release tag
        shell: pwsh
        run: |
          git fetch origin tag "${{ steps.version.outputs.tag }}"
          git rev-parse "${{ steps.version.outputs.tag }}^{commit}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Codeforces Inline ${{ steps.version.outputs.tag }}
          body: |
            Codeforces Inline ${{ steps.version.outputs.version }} 已发布。

            本版本新增题目收藏、刷题状态、个人备注和刷题仪表盘，完善登录与提交稳定性，并修复英文/俄文题面翻译、俄文界面汉化及时间/内存限制显示问题。

            下载下方 VSIX 后，在 VS Code 中执行“扩展：从 VSIX 安装”。完整更新记录请查看 CHANGELOG.md。
          files: ${{ steps.version.outputs.asset }}
          fail_on_unmatched_files: true
          overwrite_files: true
